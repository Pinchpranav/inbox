# inbox — single nginx site (replaces the old OpenClaw-era /gw proxy).
#
# Two jobs on the SAME port, routed by URL path:
#   /        → serve the built SPA from dist/ (client-routing fallback)
#   /api/    → reverse-proxy HTTP + WebSocket to the Hono backend
#
# start.sh installs this (substituting __DIST__ and __BACKEND__) and reloads nginx.
# The browser only ever talks to nginx (one origin), so there is no CORS.

# Define the WebSocket Connection header in http context (conf.d is included there).
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    # __LISTEN__ is substituted by start.sh. Default 127.0.0.1:8085 — a free
    # loopback port, so we don't clash with Coolify's :80 nginx on this box.
    # Cloudflared (same host) reaches it via loopback; nothing else can.
    listen __LISTEN__;
    server_name _;

    root __DIST__;
    index index.html;

    # 1. Serve the built SPA (index.html fallback for client routing)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # No URI on proxy_pass: preserve the full /api/... path.
    location /api/ {
        proxy_pass http://__BACKEND__;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;      # WS upgrade for /api/chat/:key
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cf-Access-Jwt-Assertion $http_cf_access_jwt_assertion;

        # Keep long-lived streaming connections alive during model thinking.
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}

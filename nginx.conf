# nginx config for the inbox app container.
#
# Serves the built SPA at / and reverse-proxies /gw/ (REST + WebSocket) to the
# openclaw gateway container. The browser is same-origin with the gateway
# (app at https://inbox.pranavself.uk, gateway at https://inbox.pranavself.uk/gw),
# so there is no CORS / no preflight — the gateway plugin route doesn't emit
# CORS headers, and same-origin avoids the browser's CORS check entirely.
#
# Origin handling (the prescribed way, not a loopback hack): the real browser
# Origin (https://inbox.pranavself.uk) is passed through unchanged; the gateway
# trusts it because the deploy adds this origin to OPENCLAW_ALLOWED_ORIGINS
# (gateway.controlUi.allowedOrigins). Nothing here overrides Origin.
#
# The 24h read/send timeouts prevent nginx from killing long-lived WS streams
# during silent model-thinking gaps (default is 60s).

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA: serve static assets, fall back to index.html for client routing.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Same-origin gateway proxy (REST + WebSocket).
    # Trailing slashes on both the location and proxy_pass strip the /gw/ prefix
    # cleanly: /gw/plugins/projects/api → /plugins/projects/api, and the WS
    # connect (/gw/) → / (the gateway WS endpoint is at the root).
    location /gw/ {
        proxy_pass http://openclaw:8080/;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}